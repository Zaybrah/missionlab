<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MissionLab Scenario Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"><\/script>')</script>
<style>
:root {
  /* Layout: one column of controls on the left, the map takes everything else.
     One screen; the page itself never scrolls, only the control column does. */
  --paper: #e8ecef;      /* page and empty map */
  --panel: #f8fafb;      /* control column, floating map controls */
  --ink: #17222c;        /* text, selection */
  --ink-2: #566370;      /* secondary text */
  --line: #c9d1d8;       /* borders */
  --ground-lo: #c7d0d7;  /* lowest walkable ground */
  --ground-hi: #7d8f9d;  /* highest walkable ground */
  --enemy: #c5402a;      /* enemies and their routes */
  --friend: #1c6dcc;     /* insertion points, primary action */
  --warn: #a4660f;       /* something to check */
  --place: #7a4bb0;      /* named places */
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #11171c; --panel: #19212a; --ink: #e6ebef; --ink-2: #9aa8b4; --line: #313d48;
    --ground-lo: #27323c; --ground-hi: #64747f;
    --enemy: #f07256; --friend: #62a8f2; --warn: #e2a84b; --place: #b892e8;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #11171c; --panel: #19212a; --ink: #e6ebef; --ink-2: #9aa8b4; --line: #313d48;
  --ground-lo: #27323c; --ground-hi: #64747f;
  --enemy: #f07256; --friend: #62a8f2; --warn: #e2a84b; --place: #b892e8;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 14px/1.45 var(--body); display: grid; grid-template-columns: 340px minmax(0, 1fr); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--friend); outline-offset: 2px; }

/* ---------- control column ---------- */
#side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }
#side header { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
h1 { font: 600 26px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; text-wrap: balance; }
#side header p { margin: 6px 0 0; color: var(--ink-2); font-size: 12.5px; }
section { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
h2 { font: 600 15px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--ink-2); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h2 span { font: 500 12px var(--mono); letter-spacing: 0; text-transform: none; }
.hint { color: var(--ink-2); font-size: 12.5px; margin: 0; }
.hint code, .path { font: 12px var(--mono); overflow-wrap: anywhere; }
.btn { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 7px 12px; cursor: pointer; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--friend); border-color: var(--friend); color: #fff; }
.btn.danger { color: var(--enemy); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px; align-items: center; }
.field > label { color: var(--ink-2); font-size: 12.5px; }
input[type="text"], input[type="number"], textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); padding: 6px 8px; }
input[type="number"] { font-family: var(--mono); font-variant-numeric: tabular-nums; }
input[type="range"] { width: 100%; accent-color: var(--friend); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.check input { margin-top: 3px; accent-color: var(--friend); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 4px; cursor: pointer; border-left: 1px solid var(--line); font-weight: 500; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
.chip.warn { border-color: var(--warn); color: var(--warn); }
#warnings { flex-wrap: wrap; }
#sightNote { flex-basis: 100%; margin: 0; }
#squadBox { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
#squadBox .row { flex-wrap: wrap; }
#squadBox .row select, #squadBox .row input { width: auto; flex: 1; min-width: 0; }
#list li button[data-squad="true"] { box-shadow: inset 3px 0 0 var(--friend); }
.chip.info { border-color: var(--friend); color: var(--friend); }
#mapInfo { font: 12px var(--mono); color: var(--ink-2); overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
details ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-2); font-size: 12.5px; }
#saveBox details > * + * { margin-top: 8px; }

#zoneBox, #intelBox { display: flex; flex-direction: column; gap: 8px; }
#intelList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#intelList li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; font-size: 12.5px; }
#intelList b { color: var(--warn); }
#doorsBox { display: flex; flex-direction: column; gap: 8px; }
#doorList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#doorList li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; font-size: 12.5px; }
#layerBox { top: 64px; right: 12px; flex-direction: column; align-items: stretch; gap: 4px; max-height: 60%; overflow-y: auto; font-size: 12.5px; padding: 10px 12px; }
#layerBox label { display: flex; gap: 8px; align-items: center; }
#layerBox .n { margin-left: auto; font: 11px var(--mono); color: var(--ink-2); padding-left: 12px; }
#zoneList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#zoneList li { display: grid; grid-template-columns: auto 1fr auto auto; gap: 5px 6px; align-items: center; font-size: 12.5px; padding: 8px 0; border-top: 1px solid var(--line); }
#zoneList li > b { color: var(--friend); white-space: nowrap; }
#zoneList li label, #zoneList li .what, #zoneList li .sum { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--ink-2); }
#zoneList input, #zoneList select { padding: 3px 6px; }
#zoneList .what input[type="number"] { width: 64px; }
#zoneList .what select { width: auto; max-width: 160px; }
#zoneList input[type="checkbox"] { width: auto; flex: none; margin-top: 2px; }
#zoneList li label { flex-wrap: nowrap; align-items: flex-start; }
#zoneList .grp { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
#trigAdd select { width: auto; flex: 1; }
#doorTrigs { display: flex; flex-direction: column; gap: 6px; }
#missionBox, #waveBox { display: flex; flex-direction: column; gap: 8px; }
#waveBox { margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
/* The panel shows one part at a time, so it never grows into one long column. */
#tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 10px 18px; position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line); }
#tabs button { border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 6px; padding: 5px 4px; font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
#tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
#tabs button .n { opacity: .7; font-variant-numeric: tabular-nums; margin-left: 3px; }
#side[data-pane="create"]:not([data-show="map"]):not([data-show="all"]) section[data-tab="map"] { display: none !important; }
#side[data-pane="create"]:not([data-show="enemies"]):not([data-show="all"]) section[data-tab="enemies"] { display: none !important; }
#side[data-pane="create"]:not([data-show="triggers"]):not([data-show="all"]) section[data-tab="triggers"] { display: none !important; }
#side[data-pane="create"]:not([data-show="doors"]):not([data-show="all"]) section[data-tab="doors"] { display: none !important; }
#side[data-pane="create"]:not([data-show="mission"]):not([data-show="all"]) section[data-tab="mission"] { display: none !important; }
#side[data-pane="create"]:not([data-show="replay"]):not([data-show="all"]) section[data-tab="replay"] { display: none !important; }
/* ---------- views: Play, Create, Direct (ML-013). A section names its views in data-view; one without it is Create's, where the tabs pick among them. */
#side[data-pane="play"] > section:not([data-view~="play"]),
#side[data-pane="direct"] > section:not([data-view~="direct"]),
#side[data-pane="create"] > section[data-view]:not([data-view~="create"]) { display: none !important; }
#views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 10px 18px 0; }
#views button { border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 6px; padding: 6px 4px; font: 600 15px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
#views button:hover { border-color: var(--ink-2); }
#views button[aria-selected="true"] { background: var(--friend); border-color: var(--friend); color: #fff; }
#strip { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 0; padding: 8px 18px 10px; border-bottom: 1px solid var(--line); font-size: 12px; }
#strip div { min-width: 0; }
#strip dt { color: var(--ink-2); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
#strip dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
body[data-pane="play"] #map, body[data-pane="play"] #view3d { pointer-events: none; cursor: default; }
#catList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 260px; overflow-y: auto; }
#catList button { width: 100%; display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid transparent; background: transparent; color: inherit; border-radius: 5px; padding: 6px 8px; cursor: pointer; font-size: 13px; font-weight: 500; }
#catList button:hover { border-color: var(--line); }
#catList button[aria-current="true"] { background: var(--ink); color: var(--panel); }
#catList .meta { color: var(--ink-2); font-size: 11.5px; font-weight: 400; }
#catList button[aria-current="true"] .meta { color: inherit; opacity: .8; }
#catList .meta.refused { color: var(--enemy); }
#playLive, #catDetails { display: flex; flex-direction: column; gap: 8px; }
#catDetails { padding-top: 12px; border-top: 1px solid var(--line); }
#cdTitle { color: var(--ink); font-size: 18px; letter-spacing: .04em; }
#cdFile { font: 11.5px var(--mono); overflow-wrap: anywhere; }
#cdBriefing p { margin: 0; font-size: 12.5px; font-style: italic; }
#cdFacts { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 4px 10px; margin: 0; font-size: 12.5px; }
#cdFacts dt { color: var(--ink-2); }
#cdFacts dd { margin: 0; }
#cdCaps { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
#cdCaps .chip.untested { border-style: dashed; color: var(--warn); border-color: var(--warn); }
#cdFindings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
#cdFindings .error { color: var(--enemy); }
#cdFindings .note { color: var(--ink-2); }
#replayBox input[type="range"] { width: 100%; padding: 0; }
#replayBox select, #replayPick select { width: auto; flex: 1; min-width: 0; }
#rpStats { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
#rpStats li { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: baseline; }
#rpStats li span { color: var(--ink-2); }
#rpStats li b { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
#rpStats li button { all: unset; cursor: pointer; text-decoration: underline; font-weight: 600; font-variant-numeric: tabular-nums; }
#rpEvents { list-style: none; margin: 0; padding: 0; max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 1px; font-size: 12.5px; }
#rpEvents button { all: unset; cursor: pointer; display: block; width: 100%; box-sizing: border-box; padding: 3px 6px; border-radius: 4px; font-variant-numeric: tabular-nums; }
#rpEvents button:hover, #rpEvents button:focus-visible { background: var(--line); }
#list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: 176px; overflow-y: auto; }
#list li button { width: 100%; display: grid; grid-template-columns: 30px 62px 1fr auto; gap: 6px; align-items: center; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 4px 6px; cursor: pointer; font-size: 12.5px; }
#list li button:hover { border-color: var(--line); }
#list li button[aria-current="true"] { background: var(--ink); color: var(--panel); }
#list .n, #list .xy { font-family: var(--mono); font-variant-numeric: tabular-nums; }
#list .xy { color: var(--ink-2); }
#list li button[aria-current="true"] .xy { color: inherit; opacity: .75; }
#list .flag { color: var(--warn); font-weight: 600; }
#checkSum { margin: 6px 0 8px; }
#briefing { width: 100%; box-sizing: border-box; font: inherit; font-size: 12.5px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: inherit; resize: vertical; }
#zoneList .of { display: flex; flex-wrap: wrap; gap: 4px 10px; grid-column: 1 / -1; font-size: 12px; }
#zoneList .of label { display: inline-flex; gap: 4px; align-items: center; }
#thingList { list-style: none; margin: 8px 0 0; padding: 0; }
#thingList li button { width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit; font: inherit; font-size: 12.5px; padding: 6px 4px; cursor: pointer; }
#thingList li button[aria-current="true"] { background: var(--ink); color: var(--panel); }
#thingList li button span:last-child { font-family: var(--mono); font-size: 11.5px; opacity: .8; }
#placeList { list-style: none; margin: 8px 0 0; padding: 0; }
#placeList li button { width: 100%; display: flex; justify-content: space-between; gap: 8px; text-align: left; border: 0; border-top: 1px solid var(--line); background: transparent; color: inherit; font: inherit; font-size: 12.5px; padding: 6px 4px; cursor: pointer; }
#placeList li button span:first-child { color: var(--place); font-weight: 600; }
#placeList li button[aria-current="true"] { background: var(--ink); color: var(--panel); }
#placeList li button[aria-current="true"] span:first-child { color: inherit; }
#placeList li button span:last-child { font-family: var(--mono); font-size: 11.5px; opacity: .8; }
#placeReviewList { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
#placeReviewList li { display: grid; grid-template-columns: 1fr auto auto auto auto; gap: 6px; align-items: center; font-size: 12.5px; }
#placeReviewList b { color: var(--place); overflow-wrap: anywhere; }
#placeReviewBox { border-left: 3px solid var(--warn); padding-left: 10px; }
#checkList { list-style: none; margin: 0; padding: 0; }
#checkList li { border-top: 1px solid var(--line); }
#checkList li button { width: 100%; display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: start; text-align: left; border: 0; background: transparent; color: inherit; font: inherit; font-size: 12.5px; padding: 7px 0; cursor: pointer; }
#checkList li button:disabled { cursor: default; }
#checkList li button:not(:disabled):hover span:last-child { text-decoration: underline; }
#checkList .lv { font-weight: 600; }
#checkList .lv.problem { color: var(--enemy); }
#checkList .lv.warning { color: var(--warn); }
#checkList .lv.note { color: var(--ink-2); }
#checkList li button.fix { width: auto; display: inline-block; margin: 0 0 8px 70px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
#checkList li button.fix:hover { border-color: var(--ink-2); }
/* Trigger inspector (29c-inspect.js): the state word is a badge; a failed or unconfirmed action has its own line and colour,
   so "its actions failed" never reads like "its condition is not met". Colour is never the only sign: the words say it too. */
#inspectList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
#inspectList li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; align-items: start; padding: 7px 0 7px 8px; border-top: 1px solid var(--line); box-shadow: inset 3px 0 0 transparent; }
#inspectList li.sel { box-shadow: inset 3px 0 0 var(--ink); background: color-mix(in srgb, var(--line) 35%, transparent); }
#inspectList li.pre { box-shadow: inset 3px 0 0 var(--friend); }
#inspectList .pick { all: unset; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; font-size: 12.5px; min-width: 0; }
#inspectList .pick:focus-visible { outline: 2px solid var(--friend); outline-offset: 2px; }
#inspectList .title { font-weight: 600; overflow-wrap: anywhere; }
#inspectList .word { justify-self: end; font: 500 11.5px var(--mono); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap; }
#inspectList .num { grid-column: 1 / -1; font: 11.5px var(--mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
#inspectList .num:empty { display: none; }
#inspectList .text { grid-column: 1 / -1; color: var(--ink-2); }
#inspectList .outcome { grid-column: 1 / -1; font-weight: 600; }
#inspectList .fire { padding: 3px 8px; font-size: 12px; }
#inspectList .links { grid-column: 1 / -1; margin: 2px 0 0; }
#inspectList li.k-counting .word, #inspectList li.k-holding .word, #inspectList li.k-cooling .word { border-color: var(--friend); color: var(--friend); }
#inspectList li.k-fired .word, #inspectList li.k-exhausted .word { background: var(--ink); border-color: var(--ink); color: var(--panel); }
#inspectList li.k-off .word, #inspectList li.k-chance .word, #inspectList li.k-depends .word, #inspectList li.blocked .word { border-style: dashed; border-color: var(--warn); color: var(--warn); }
#inspectList li.k-circle .word, #inspectList li.k-never .word { border-color: var(--enemy); color: var(--enemy); }
#inspectList li.o-failed { box-shadow: inset 3px 0 0 var(--enemy); }
#inspectList li.o-failed .outcome { color: var(--enemy); }
#inspectList li.o-unconfirmed .outcome { color: var(--warn); font-weight: 500; }
#repairBox { border: 1px solid var(--warn); border-radius: 6px; padding: 8px 10px; margin: 0 0 10px; }
#repairTitle { margin: 0 0 4px; font-weight: 600; font-size: 13px; }
#repairText { margin: 0 0 6px; }
#repairEdits { margin: 0 0 8px; padding-left: 18px; font: 11.5px var(--mono); }
#zoneList li input.msg { grid-column: 1 / -1; }
/* Painting areas (27a-paint.js): the shape choice of a zone and the painting tools, shown in the row being painted. */
.shape { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.shape button { border: 0; border-left: 1px solid var(--line); background: transparent; color: inherit; padding: 3px 8px; cursor: pointer; font: inherit; font-size: 12.5px; font-weight: 500; }
.shape button:first-child { border-left: 0; }
.shape button[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
.shape.tools { display: grid; grid-auto-columns: 1fr; }
#paintBox { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; border: 1px solid var(--friend); border-radius: 6px; background: var(--paper); font-size: 12.5px; }
#paintBox .row { gap: 6px; flex-wrap: wrap; }
#paintBox input[type="number"] { width: 70px; padding: 3px 6px; }
#paintBox select { width: auto; padding: 3px 6px; }
#paintBox .btn { padding: 3px 8px; }
#paintTitle { color: var(--friend); }
#paintBox #paintParts, #paintBox #paintFindings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
#paintBox #paintParts li { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; padding: 0; border-top: 0; }
#paintBox #paintFindings li { display: block; padding: 0; border-top: 0; color: var(--enemy); }
#empty { color: var(--ink-2); font-size: 12.5px; margin: 0; }
#panel[hidden] { display: none; }
#pos { font: 12px var(--mono); color: var(--ink-2); }
#fileText { height: 130px; font: 11.5px/1.4 var(--mono); resize: vertical; }
#saveMsg:empty { display: none; }
#saveBox { margin-top: auto; border-bottom: 0; border-top: 1px solid var(--line); background: var(--panel); }
@media (min-height: 680px) { #saveBox { position: sticky; bottom: 0; box-shadow: 0 -6px 12px -10px rgb(0 0 0 / .35); } }
/* staged live changes and saved revisions (ML-014) */
body:not(.live) #stageBox { display: none; }
.pair { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.pair button { border: 0; background: transparent; color: inherit; padding: 6px 4px; cursor: pointer; font-weight: 500; }
